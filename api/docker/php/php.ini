; --- Runtime -------------------------------------------------------------
memory_limit = 512M
max_execution_time = 60
post_max_size = 24M
upload_max_filesize = 16M
expose_php = Off

; --- OPcache -------------------------------------------------------------
; validate_timestamps stays on for local development. Set it to 0 in a real
; production image (and redeploy the image to release code) for the full win.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; --- Errors --------------------------------------------------------------
; Never render errors into an HTTP response; the exception handler owns the
; response body and the log owns the detail.
display_errors = Off
log_errors = On
error_log = /dev/stderr
